name: Brewsite CI

on:
  push:
    branches:
      - development
      - staging
      - production

  pull_request:
    branches:
      - staging
      - production

  workflow_dispatch:

jobs:
  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  environment-check:
    name: Environment Promotion
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Show promoted environment
        run: echo "Promoted to ${{ github.ref_name }}"