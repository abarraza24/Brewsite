name: Brewsite CI

on:
  push:
    branches:
      - development
      - staging
      - production

  pull_request:
    branches:
      - staging
      - production

  workflow_dispatch:

jobs:
  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v


  environment-promotion:
    name: Environment Promotion
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Show promoted environment
        run: echo "Promoted to ${{ github.ref_name }}"


  notify-success:
    name: Notify Teams - Success
    if: success() && github.event_name == 'push'
    needs:
      - test
      - environment-promotion
    runs-on: ubuntu-latest

    steps:
      - name: Send success message to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ Brewsite pipeline succeeded on branch ${{ github.ref_name }}. Commit: ${{ github.sha }}\"}" \
            "$TEAMS_WEBHOOK_URL"


  notify-failure:
    name: Notify Teams - Failure
    if: failure() && github.event_name == 'push'
    needs:
      - test
      - environment-promotion
    runs-on: ubuntu-latest

    steps:
      - name: Send failure message to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ Brewsite pipeline failed on branch ${{ github.ref_name }}. Commit: ${{ github.sha }}\"}" \
            "$TEAMS_WEBHOOK_URL"